logging:
  version: 1
  formatters:
    detailed:
      format: '%(asctime)s %(name)-15s %(levelname)-8s %(message)s'
  handlers:
    console:
      class: logging.StreamHandler
      level: DEBUG
      formatter: detailed
      stream: ext://sys.stdout
    file:
      class: logging.FileHandler
      level: DEBUG
      formatter: detailed
      filename: log/application.log  # 指定日志文件路径
  loggers:
    sqlalchemy.engine:
      level: INFO
      handlers: [console, file]
      propagate: no
  root:
    level: DEBUG
    handlers: [console, file]